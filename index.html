<title>Negotiators Express CRM</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,500;87.5,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --line:#D4DAE1;
  --ink:#16212B; --ink-2:#4A5763; --ink-3:#7C8792;
  --accent:#1F7A5C; --accent-ink:#FFFFFF; --accent-soft:#DDF1E8;
  --warn:#B45309; --warn-soft:#FDEBD3; --crit:#B42318; --crit-soft:#FBE3E0;
  --money:#1F7A5C; --shadow:0 1px 2px rgba(22,33,43,.06),0 8px 24px rgba(22,33,43,.06);
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#18212A; --surface-2:#212C37; --line:#2E3A46;
  --ink:#E6EBF0; --ink-2:#AEB9C4; --ink-3:#7C8792;
  --accent:#3FB48C; --accent-ink:#0F151B; --accent-soft:#173B30;
  --warn:#F0A048; --warn-soft:#3D2A10; --crit:#F0736A; --crit-soft:#3F1A17;
  --money:#3FB48C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#18212A; --surface-2:#212C37; --line:#2E3A46;
  --ink:#E6EBF0; --ink-2:#AEB9C4; --ink-3:#7C8792;
  --accent:#3FB48C; --accent-ink:#0F151B; --accent-soft:#173B30;
  --warn:#F0A048; --warn-soft:#3D2A10; --crit:#F0736A; --crit-soft:#3F1A17;
  --money:#3FB48C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.brand span{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.sync{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.on i{background:var(--accent)}
.sync.local i{background:var(--warn)}

/* money strip */
.strip{max-width:1100px;margin:0 auto;padding:16px 16px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.tile .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.tile .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.2;margin-top:2px}
.tile .v.money{color:var(--money)}
.tile .v.crit{color:var(--crit)}
.tile .s{font-size:12px;color:var(--ink-2)}
@media (max-width:640px){.strip{grid-template-columns:1fr 1fr}.tile .v{font-size:20px}}

/* nav */
.nav{max-width:1100px;margin:0 auto;padding:14px 16px 0;display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.nav .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--crit-soft);color:var(--crit);font-size:11px;font-weight:600;margin-left:4px;text-align:center}

main{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}

/* pipeline */
.stages{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.stage-chip{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--surface);display:flex;gap:8px;align-items:baseline;cursor:pointer}
.stage-chip b{font-family:var(--display)}
.stage-chip.active{border-color:var(--accent);background:var(--accent-soft)}
.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.row:hover{box-shadow:var(--shadow)}
.row .bar{width:4px;height:100%;min-height:36px;border-radius:2px;background:var(--line)}
.row .bar[data-s="Lead"]{background:#8A94A0}
.row .bar[data-s="Signed"]{background:#4C7BD9}
.row .bar[data-s="Estimate"]{background:#7B61C9}
.row .bar[data-s="Submitted"]{background:#2A9DB5}
.row .bar[data-s="Negotiating"]{background:var(--warn)}
.row .bar[data-s="Settled"]{background:var(--accent)}
.row .bar[data-s="Paid"]{background:var(--accent)}
.row .t{font-weight:600}
.row .m{font-size:13px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.row .r{text-align:right}
.row .r .amt{font-family:var(--display);font-size:18px;font-weight:700}
.row .r .fee{font-size:12px;color:var(--money)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2)}
.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.over{background:var(--crit-soft);color:var(--crit)}
.empty{border:1px dashed var(--line);border-radius:6px;padding:28px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* contacts */
.c-row{grid-template-columns:1fr auto}
.role{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.c-row a{color:var(--accent);text-decoration:none}

/* tasks */
.task{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.task.done{opacity:.55}
.task.done .tt{text-decoration:line-through}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.task .sub{font-size:13px;color:var(--ink-2)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 8px}
.section-h h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;justify-content:flex-end}
.overlay[hidden]{display:none}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.drawer h2{font-size:22px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--ink-2);font-weight:500}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.f textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.actions .spacer{margin-right:auto}
.calc{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.calc b{font-family:var(--display);font-size:18px;color:var(--money)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:30;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.row,.task{transition:box-shadow .15s}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><h1>Negotiators Express</h1><span>Claims CRM</span></div>
  <div class="sync" id="sync"><i></i><span id="syncText">Connecting…</span></div>
</div></header>

<section class="strip" aria-label="Money at a glance">
  <div class="tile"><div class="l">Open pipeline</div><div class="v money num" id="kOpen">$0</div><div class="s" id="kOpenS">0 active claims</div></div>
  <div class="tile"><div class="l">Fees expected</div><div class="v money num" id="kFees">$0</div><div class="s">on open claims</div></div>
  <div class="tile"><div class="l">Fees collected</div><div class="v num" id="kPaid">$0</div><div class="s" id="kPaidS">0 paid</div></div>
  <div class="tile"><div class="l">Follow-ups due</div><div class="v num" id="kDue">0</div><div class="s" id="kDueS">nothing overdue</div></div>
</section>

<nav class="nav" role="tablist">
  <button role="tab" id="tab-pipeline" aria-selected="true" data-view="pipeline">Pipeline</button>
  <button role="tab" id="tab-followups" aria-selected="false" data-view="followups">Follow-ups <span class="badge" id="fuBadge" hidden>0</span></button>
  <button role="tab" id="tab-contacts" aria-selected="false" data-view="contacts">Contacts</button>
</nav>

<main>
  <section id="v-pipeline">
    <div class="toolbar">
      <input type="search" id="qClaims" placeholder="Search claimant, carrier, claim #…" aria-label="Search claims">
      <button class="btn primary" id="addClaim">+ New claim</button>
    </div>
    <div class="stages" id="stages"></div>
    <div class="list" id="claimList"></div>
  </section>

  <section id="v-followups" hidden>
    <div class="toolbar">
      <button class="btn primary" id="addTask">+ New follow-up</button>
      <label style="font-size:13px;color:var(--ink-2)"><input type="checkbox" id="showDone"> show completed</label>
    </div>
    <div id="taskGroups"></div>
  </section>

  <section id="v-contacts" hidden>
    <div class="toolbar">
      <input type="search" id="qContacts" placeholder="Search name, company, phone…" aria-label="Search contacts">
      <select id="roleFilter" aria-label="Filter by role"><option value="">All roles</option></select>
      <button class="btn primary" id="addContact">+ New contact</button>
    </div>
    <div class="list" id="contactList"></div>
  </section>
</main>

<div class="overlay" id="overlay" hidden><div class="drawer" id="drawer" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const STAGES=["Lead","Signed","Estimate","Submitted","Negotiating","Settled","Paid","Lost"];
const OPEN=new Set(["Lead","Signed","Estimate","Submitted","Negotiating","Settled"]);
const ROLES=["Claimant","Adjuster","Public Adjuster","Contractor","Attorney","Referral Source","Carrier Rep","Other"];
const money=n=>"$"+(Math.round(+n||0)).toLocaleString("en-US");
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=d=>{if(!d)return"";const [y,m,dd]=d.split("-");return `${+m}/${+dd}/${y.slice(2)}`;};

// ---------- storage: db capability with localStorage fallback ----------
const state={claims:{},contacts:{},tasks:{}};
let db=null, mode="local";
const LS="nx-crm-v1";
function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j)Object.assign(state,j);}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
const store={
  async put(col,id,data){
    state[col][id]=data; render();
    if(db){ try{ await db.doc(col+"/"+id).set(data); }catch(e){ toast("Save failed — "+(e.code||"error")); } }
    else lsSave();
  },
  async del(col,id){
    delete state[col][id]; render();
    if(db){ try{ await db.doc(col+"/"+id).delete(); }catch(e){ toast("Delete failed"); } }
    else lsSave();
  }
};
function setSync(m,txt){const el=$("#sync");el.className="sync "+m;$("#syncText").textContent=txt;}
async function boot(){
  lsLoad(); render();
  const c=window.claude&&window.claude.use?await window.claude.use("db").catch(()=>null):null;
  if(!c){ mode="local"; setSync("local","Saved on this device only"); return; }
  db=c; mode="db";
  for(const col of ["claims","contacts","tasks"]){
    db.collection(col).onSnapshot(snap=>{
      const next={}; snap.docs.forEach(d=>{ if(d.exists) next[d.id]=d.data(); });
      state[col]=next; render();
      setSync("on", snap.metadata.fromCache?"Syncing…":"Synced");
    }, err=>{ setSync("local","Sync lost ("+err.code+")"); });
  }
}

// ---------- derived ----------
const fee=c=>{ const base=+c.settledAmount||+c.offerAmount||+c.estimateAmount||0; return +c.feeAmount||base*((+c.feePct||0)/100); };
function taskStatus(t){ if(t.done)return"done"; if(!t.due)return"open"; const d=today(); return t.due<d?"over":t.due===d?"due":"open"; }
function contactName(id){ return id&&state.contacts[id]?state.contacts[id].name:""; }

// ---------- render ----------
let view="pipeline", stageFilter="";
function render(){ renderKPIs(); renderPipeline(); renderTasks(); renderContacts(); }
function renderKPIs(){
  const cl=Object.values(state.claims);
  const open=cl.filter(c=>OPEN.has(c.stage));
  const openVal=open.reduce((s,c)=>s+(+c.settledAmount||+c.offerAmount||+c.estimateAmount||0),0);
  const fees=open.reduce((s,c)=>s+fee(c),0);
  const paid=cl.filter(c=>c.stage==="Paid");
  const paidFees=paid.reduce((s,c)=>s+fee(c),0);
  const ts=Object.values(state.tasks).filter(t=>!t.done);
  const over=ts.filter(t=>taskStatus(t)==="over").length, due=ts.filter(t=>taskStatus(t)==="due").length;
  $("#kOpen").textContent=money(openVal); $("#kOpenS").textContent=`${open.length} active claim${open.length===1?"":"s"}`;
  $("#kFees").textContent=money(fees);
  $("#kPaid").textContent=money(paidFees); $("#kPaidS").textContent=`${paid.length} paid`;
  const k=$("#kDue"); k.textContent=over+due; k.className="v num"+(over?" crit":"");
  $("#kDueS").textContent=over?`${over} overdue`:due?"all due today":"nothing overdue";
  const b=$("#fuBadge"); b.hidden=!(over+due); b.textContent=over+due;
}
function renderPipeline(){
  const q=($("#qClaims").value||"").toLowerCase();
  const all=Object.entries(state.claims).map(([id,c])=>({id,...c}));
  const counts={}; all.forEach(c=>counts[c.stage]=(counts[c.stage]||0)+1);
  $("#stages").innerHTML=STAGES.map(s=>`<button class="stage-chip${stageFilter===s?" active":""}" data-s="${s}">${s} <b class="num">${counts[s]||0}</b></button>`).join("");
  let rows=all.filter(c=>!stageFilter||c.stage===stageFilter)
    .filter(c=>!q||[c.claimant,c.carrier,c.claimNumber,c.lossType,c.address].join(" ").toLowerCase().includes(q))
    .sort((a,b)=>STAGES.indexOf(a.stage)-STAGES.indexOf(b.stage)||(b.updatedAt||"").localeCompare(a.updatedAt||""));
  const list=$("#claimList");
  if(!rows.length){ list.innerHTML=`<div class="empty"><h3>${all.length?"No claims match":"No claims yet"}</h3>${all.length?"":"Add your first claim — every one you track here shows up in the money strip above."}</div>`; return; }
  list.innerHTML=rows.map(c=>{
    const amt=+c.settledAmount||+c.offerAmount||+c.estimateAmount||0;
    const label=c.settledAmount?"settled":c.offerAmount?"offer":c.estimateAmount?"estimate":"";
    const nxt=c.nextDate?`<span class="pill ${c.nextDate<today()?"over":c.nextDate===today()?"due":""}">${esc(c.nextAction||"Follow up")} · ${fmtDate(c.nextDate)}</span>`:"";
    return `<div class="row" data-claim="${c.id}"><div class="bar" data-s="${esc(c.stage)}"></div>
      <div><div class="t">${esc(c.claimant||"(no claimant)")} <span class="pill">${esc(c.stage)}</span></div>
      <div class="m">${c.lossType?`<span>${esc(c.lossType)}</span>`:""}${c.carrier?`<span>${esc(c.carrier)}</span>`:""}${c.claimNumber?`<span class="mono">#${esc(c.claimNumber)}</span>`:""}${nxt}</div></div>
      <div class="r"><div class="amt num">${amt?money(amt):"—"}</div><div class="fee num">${amt?`${label} · fee ${money(fee(c))}`:"no figure yet"}</div></div></div>`;
  }).join("");
}
function renderTasks(){
  const showDone=$("#showDone").checked;
  const ts=Object.entries(state.tasks).map(([id,t])=>({id,...t})).filter(t=>showDone||!t.done)
    .sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
  const groups={over:[],due:[],open:[],done:[]}; ts.forEach(t=>groups[taskStatus(t)].push(t));
  const titles={over:"Overdue",due:"Due today",open:"Coming up",done:"Completed"};
  const el=$("#taskGroups");
  if(!ts.length){ el.innerHTML=`<div class="empty"><h3>No follow-ups</h3>Every open claim should have a next call, email, or document on the calendar.</div>`; return; }
  el.innerHTML=Object.keys(groups).filter(k=>groups[k].length).map(k=>`<div class="section-h"><h2>${titles[k]}</h2><span class="num" style="color:var(--ink-3);font-size:13px">${groups[k].length}</span></div><div class="list">`+
    groups[k].map(t=>`<div class="task${t.done?" done":""}" data-task="${t.id}"><input type="checkbox" ${t.done?"checked":""} aria-label="Done" data-toggle="${t.id}"><div><div class="tt">${esc(t.title)}</div><div class="sub">${t.claimId&&state.claims[t.claimId]?esc(state.claims[t.claimId].claimant)+" · ":""}${t.due?`<span class="pill ${k==="over"?"over":k==="due"?"due":""}">${fmtDate(t.due)}</span>`:"no date"}</div></div><button class="btn sm" data-edit-task="${t.id}">Edit</button></div>`).join("")+"</div>").join("");
}
function renderContacts(){
  const q=($("#qContacts").value||"").toLowerCase(), rf=$("#roleFilter").value;
  const rows=Object.entries(state.contacts).map(([id,c])=>({id,...c}))
    .filter(c=>!rf||c.role===rf).filter(c=>!q||[c.name,c.company,c.phone,c.email].join(" ").toLowerCase().includes(q))
    .sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const list=$("#contactList");
  if(!rows.length){ list.innerHTML=`<div class="empty"><h3>${Object.keys(state.contacts).length?"No contacts match":"No contacts yet"}</h3>Claimants, adjusters, contractors, and the people who send you work.</div>`; return; }
  list.innerHTML=rows.map(c=>`<div class="row c-row" data-contact="${c.id}"><div><div class="role">${esc(c.role||"Contact")}${c.company?" · "+esc(c.company):""}</div><div class="t">${esc(c.name)}</div>
    <div class="m">${c.phone?`<a href="tel:${esc(c.phone)}" onclick="event.stopPropagation()">${esc(c.phone)}</a>`:""}${c.email?`<a href="mailto:${esc(c.email)}" onclick="event.stopPropagation()">${esc(c.email)}</a>`:""}</div></div>
    <div class="r num" style="font-size:13px;color:var(--ink-2)">${Object.values(state.claims).filter(x=>x.contactId===c.id).length||""}${Object.values(state.claims).some(x=>x.contactId===c.id)?" claims":""}</div></div>`).join("");
}

// ---------- drawers ----------
const opt=(arr,v)=>arr.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
const contactOpts=v=>`<option value="">— none —</option>`+Object.entries(state.contacts).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||"")).map(([id,c])=>`<option value="${id}" ${id===v?"selected":""}>${esc(c.name)}</option>`).join("");
const claimOpts=v=>`<option value="">— none —</option>`+Object.entries(state.claims).map(([id,c])=>`<option value="${id}" ${id===v?"selected":""}>${esc(c.claimant)} (${esc(c.stage)})</option>`).join("");
function openDrawer(html){ $("#drawer").innerHTML=html; $("#overlay").hidden=false; const f=$("#drawer input,#drawer select"); f&&f.focus(); }
function closeDrawer(){ $("#overlay").hidden=true; }
const F=(id,label,type,val,extra="")=>`<div class="f"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val??"")}" ${extra}></div>`;

function claimForm(id){
  const c=id?state.claims[id]:{stage:"Lead",feePct:10};
  openDrawer(`<h2>${id?"Claim":"New claim"}</h2>
    ${F("f_claimant","Claimant name","text",c.claimant,"required")}
    <div class="f"><label for="f_contact">Linked contact</label><select id="f_contact">${contactOpts(c.contactId)}</select></div>
    <div class="grid2">${F("f_lossType","Type of loss","text",c.lossType,'placeholder="Water — Cat 2"')}${F("f_dol","Date of loss","date",c.dol)}</div>
    ${F("f_address","Property address","text",c.address)}
    <div class="grid2">${F("f_carrier","Carrier","text",c.carrier)}${F("f_claimNumber","Claim #","text",c.claimNumber)}</div>
    <div class="grid2"><div class="f"><label for="f_stage">Stage</label><select id="f_stage">${opt(STAGES,c.stage)}</select></div>${F("f_feePct","Your fee %","number",c.feePct,'min="0" step="0.5"')}</div>
    <div class="grid2">${F("f_estimate","Your estimate $","number",c.estimateAmount,'min="0" step="1"')}${F("f_offer","Carrier offer $","number",c.offerAmount,'min="0" step="1"')}</div>
    <div class="grid2">${F("f_settled","Settled $","number",c.settledAmount,'min="0" step="1"')}${F("f_feeAmount","Fee override $","number",c.feeAmount,'min="0" step="1" placeholder="leave blank to use %"')}</div>
    <div class="calc"><span>Your fee on this claim</span><b id="feePreview" class="num">${money(fee(c))}</b></div>
    <div class="grid2">${F("f_nextAction","Next action","text",c.nextAction,'placeholder="Call adjuster re: supplement"')}${F("f_nextDate","Next action date","date",c.nextDate)}</div>
    <div class="f"><label for="f_notes">Notes</label><textarea id="f_notes">${esc(c.notes)}</textarea></div>
    <div class="actions">${id?`<button class="btn danger spacer" id="delClaim">Delete</button>`:""}<button class="btn" id="cancel">Cancel</button><button class="btn primary" id="saveClaim">Save claim</button></div>`);
  const recalc=()=>{ $("#feePreview").textContent=money(fee(readClaim())); };
  ["f_estimate","f_offer","f_settled","f_feePct","f_feeAmount"].forEach(i=>$("#"+i).addEventListener("input",recalc));
  $("#saveClaim").onclick=async()=>{ const d=readClaim(); if(!d.claimant){toast("Claimant name is required");return;} d.updatedAt=new Date().toISOString(); d.createdAt=c.createdAt||d.updatedAt; await store.put("claims",id||uid(),d); closeDrawer(); toast("Claim saved"); };
  if(id) $("#delClaim").onclick=async()=>{ await store.del("claims",id); closeDrawer(); toast("Claim deleted"); };
}
function readClaim(){ const v=i=>$("#"+i).value.trim(); const n=i=>v(i)===""?null:+v(i);
  return {claimant:v("f_claimant"),contactId:v("f_contact")||null,lossType:v("f_lossType"),dol:v("f_dol"),address:v("f_address"),carrier:v("f_carrier"),claimNumber:v("f_claimNumber"),stage:v("f_stage"),feePct:n("f_feePct"),estimateAmount:n("f_estimate"),offerAmount:n("f_offer"),settledAmount:n("f_settled"),feeAmount:n("f_feeAmount"),nextAction:v("f_nextAction"),nextDate:v("f_nextDate"),notes:$("#f_notes").value.trim()}; }

function contactForm(id){
  const c=id?state.contacts[id]:{role:"Claimant"};
  openDrawer(`<h2>${id?"Contact":"New contact"}</h2>
    ${F("c_name","Name","text",c.name,"required")}
    <div class="grid2"><div class="f"><label for="c_role">Role</label><select id="c_role">${opt(ROLES,c.role)}</select></div>${F("c_company","Company / carrier","text",c.company)}</div>
    <div class="grid2">${F("c_phone","Phone","tel",c.phone)}${F("c_email","Email","email",c.email)}</div>
    <div class="f"><label for="c_notes">Notes</label><textarea id="c_notes">${esc(c.notes)}</textarea></div>
    <div class="actions">${id?`<button class="btn danger spacer" id="delContact">Delete</button>`:""}<button class="btn" id="cancel">Cancel</button><button class="btn primary" id="saveContact">Save contact</button></div>`);
  $("#saveContact").onclick=async()=>{ const v=i=>$("#"+i).value.trim(); const d={name:v("c_name"),role:v("c_role"),company:v("c_company"),phone:v("c_phone"),email:v("c_email"),notes:$("#c_notes").value.trim(),createdAt:c.createdAt||new Date().toISOString()};
    if(!d.name){toast("Name is required");return;} await store.put("contacts",id||uid(),d); closeDrawer(); toast("Contact saved"); };
  if(id) $("#delContact").onclick=async()=>{ await store.del("contacts",id); closeDrawer(); toast("Contact deleted"); };
}
function taskForm(id){
  const t=id?state.tasks[id]:{due:today()};
  openDrawer(`<h2>${id?"Follow-up":"New follow-up"}</h2>
    ${F("t_title","What needs to happen","text",t.title,'required placeholder="Send supplement to adjuster"')}
    <div class="grid2">${F("t_due","Due","date",t.due)}<div class="f"><label for="t_claim">Claim</label><select id="t_claim">${claimOpts(t.claimId)}</select></div></div>
    <div class="actions">${id?`<button class="btn danger spacer" id="delTask">Delete</button>`:""}<button class="btn" id="cancel">Cancel</button><button class="btn primary" id="saveTask">Save</button></div>`);
  $("#saveTask").onclick=async()=>{ const d={title:$("#t_title").value.trim(),due:$("#t_due").value,claimId:$("#t_claim").value||null,done:!!t.done,createdAt:t.createdAt||new Date().toISOString()};
    if(!d.title){toast("Say what needs to happen");return;} await store.put("tasks",id||uid(),d); closeDrawer(); };
  if(id) $("#delTask").onclick=async()=>{ await store.del("tasks",id); closeDrawer(); };
}

// ---------- events ----------
document.querySelectorAll(".nav [role=tab]").forEach(b=>b.addEventListener("click",()=>{
  view=b.dataset.view; document.querySelectorAll(".nav [role=tab]").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["pipeline","followups","contacts"].forEach(v=>$("#v-"+v).hidden=v!==view);
}));
$("#addClaim").onclick=()=>claimForm(); $("#addContact").onclick=()=>contactForm(); $("#addTask").onclick=()=>taskForm();
$("#qClaims").addEventListener("input",renderPipeline); $("#qContacts").addEventListener("input",renderContacts);
$("#roleFilter").innerHTML+=ROLES.map(r=>`<option>${r}</option>`).join(""); $("#roleFilter").addEventListener("change",renderContacts);
$("#showDone").addEventListener("change",renderTasks);
$("#stages").addEventListener("click",e=>{ const b=e.target.closest("[data-s]"); if(!b)return; stageFilter=stageFilter===b.dataset.s?"":b.dataset.s; renderPipeline(); });
$("#claimList").addEventListener("click",e=>{ const r=e.target.closest("[data-claim]"); if(r) claimForm(r.dataset.claim); });
$("#contactList").addEventListener("click",e=>{ const r=e.target.closest("[data-contact]"); if(r) contactForm(r.dataset.contact); });
$("#taskGroups").addEventListener("click",async e=>{
  const tg=e.target.closest("[data-toggle]"); if(tg){ const t={...state.tasks[tg.dataset.toggle],done:tg.checked}; await store.put("tasks",tg.dataset.toggle,t); return; }
  const ed=e.target.closest("[data-edit-task]"); if(ed) taskForm(ed.dataset.editTask);
});
$("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay"||e.target.id==="cancel") closeDrawer(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2200); }

boot();
})();
</script>
